# Native Debian: SPA + reverse proxy to uvicorn.
# Ports overridden at install time via sed (STRATUM_HTTP_PORT / STRATUM_API_PORT).
# Cohost with Klaris: HTTP 8080, API 8001 — see docs/COHOST_KLARIS.md

upstream stratum_api {
    server 127.0.0.1:__STRATUM_API_PORT__;
    keepalive 8;
}

server {
    listen __STRATUM_HTTP_PORT__ default_server;
    listen [::]:__STRATUM_HTTP_PORT__ default_server;
    server_name _;

    root /var/www/stratum;
    index index.html;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://stratum_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://stratum_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://stratum_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://stratum_api;
        proxy_set_header Host $host;
    }

    location /api/health {
        proxy_pass http://stratum_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location /hooks/github {
        proxy_pass http://127.0.0.1:9000/hooks/github;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_read_timeout 10s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
